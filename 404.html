<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUTLAWS · Not found</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Archivo:wght@400;600&display=swap">
<style>
  :root { --ground: #0B0F08; --gold: #D9A441; --gold-hi: #F2CE7E; --text: #DCE0D2; --text-dim: #949D86; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: var(--ground); color: var(--text);
         font: 16px/1.6 "Archivo", system-ui, sans-serif; text-align: center; padding: 16px; }
  h1 { font: 16px/1.6 "Press Start 2P", monospace; color: var(--gold); margin: 0 0 12px; }
  p { color: var(--text-dim); margin: 0 0 24px; }
  a { font: 10px "Press Start 2P", monospace; color: #1A1206; background: var(--gold); padding: 12px 14px;
      text-decoration: none; margin: 4px; display: inline-block; }
  a.alt { background: none; color: var(--gold-hi); border: 1px solid var(--gold); }
</style>
</head>
<body>
<main>
  <h1 id="h">This trail leads nowhere</h1>
  <p id="p">This address doesn't exist. Back to the road:</p>
  <a id="play" href="/jogar/">Play</a><a id="home" class="alt" href="/">Home</a>
</main>
<script>
  // No GitHub Pages o site mora em /<repositório>/; na Vercel, na raiz.
  const seg = location.pathname.split('/')[1];
  const base = location.hostname.endsWith('.github.io') && seg ? '/' + seg + '/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('play').href = base + 'jogar/';
  // o idioma que a pessoa escolheu no jogo (mesma chave do i18n.js)
  const T = {
    pt: ['Essa trilha não leva a lugar nenhum', 'O endereço não existe. Volte pra estrada:', 'Jogar', 'Início', 'pt-BR'],
    es: ['Este sendero no lleva a ninguna parte', 'Esta dirección no existe. Vuelve al camino:', 'Jugar', 'Inicio', 'es'],
    fil: ['Walang patutunguhan ang landas na ito', 'Walang ganitong address. Bumalik sa daan:', 'Maglaro', 'Simula', 'fil'],
  };
  let l = null;
  try { l = localStorage.getItem('outlaws:lang'); } catch {}
  if (T[l]) {
    const [h, p, play, home, html] = T[l];
    document.getElementById('h').textContent = h;
    document.getElementById('p').textContent = p;
    document.getElementById('play').textContent = play;
    document.getElementById('home').textContent = home;
    document.documentElement.lang = html;
  }
</script>
</body>
</html>
